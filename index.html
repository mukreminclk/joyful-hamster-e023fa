function isoToday() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function isoAddDays(iso, days) {
  const p = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  dt.setUTCDate(dt.getUTCDate() + days);
  return dt.getUTCFullYear() + "-" + String(dt.getUTCMonth() + 1).padStart(2, "0") + "-" + String(dt.getUTCDate()).padStart(2, "0");
}
function isoDiffDays(isoA, isoB) {
  const a = isoA.split("-").map(Number);
  const b = isoB.split("-").map(Number);
  const ta = Date.UTC(a[0], a[1] - 1, a[2]);
  const tb = Date.UTC(b[0], b[1] - 1, b[2]);
  return Math.round((ta - tb) / 86400000);
}
function formatDateTR(iso) {
  if (!iso) return "";
  const p = iso.split("-");
  if (p.length !== 3) return iso;
  return p[2] + "." + p[1] + "." + p[0];
}
function getDueStatus(lastDateIso, intervalDays) {
  if (!lastDateIso || !intervalDays) return null;
  const dueDateIso = isoAddDays(lastDateIso, intervalDays);
  const diff = isoDiffDays(dueDateIso, isoToday());
  return { dueDateIso: dueDateIso, diffDays: diff, overdue: diff < 0, dueToday: diff === 0 };
}
function formatArea(m2) {
  const safeM2 = Number(m2) || 0;
  const m2Str = Math.round(safeM2).toLocaleString("tr-TR") + " m²";
  if (safeM2 >= 100) {
    const donum = safeM2 / 1000;
    const donumStr = donum.toLocaleString("tr-TR", { maximumFractionDigits: 2 }) + " dönüm";
    return m2Str + " (" + donumStr + ")";
  }
  return m2Str;
}
function isoOfYMD(y, m, d) {
  return y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
}

let uidCounter = 0;
function uid() {
  uidCounter += 1;
  return Date.now().toString(36) + "-" + uidCounter + "-" + Math.random().toString(36).slice(2, 7);
}
/* ------------------------------------------------------------------ */
/*  Supabase client management (config lives in this browser only)     */
/* ------------------------------------------------------------------ */

const CONFIG_KEY = "bahce_defterim_supabase_config";

function loadSupabaseConfig() {
  try {
    const raw = window.localStorage.getItem(CONFIG_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed && parsed.url && parsed.anonKey) return parsed;
    return null;
  } catch (e) {
    return null;
  }
}
function saveSupabaseConfig(url, anonKey) {
  try {
    window.localStorage.setItem(CONFIG_KEY, JSON.stringify({ url: url, anonKey: anonKey }));
    return true;
  } catch (e) {
    return false;
  }
}
function clearSupabaseConfig() {
  try {
    window.localStorage.removeItem(CONFIG_KEY);
  } catch (e) {
    /* ignore */
  }
}
function createSupabaseClient(url, anonKey) {
  const lib = window.supabase;
  if (!lib || !lib.createClient) return null;
  try {
    return lib.createClient(url, anonKey);
  } catch (e) {
    return null;
  }
}

function SetupScreen({ onSaved }) {
  const [url, setUrl] = useState("");
  const [anonKey, setAnonKey] = useState("");
  const [error, setError] = useState("");
  const [checking, setChecking] = useState(false);

  async function handleSubmit() {
    setError("");
    const trimmedUrl = url.trim().replace(/\/+$/, "");
    const trimmedKey = anonKey.trim();
    if (!trimmedUrl || !/^https?:\/\//.test(trimmedUrl)) {
      setError("Geçerli bir Project URL girin (https:// ile başlamalı).");
      return;
    }
    if (!trimmedKey || trimmedKey.length < 20) {
      setError("Geçerli bir anon / public API key girin.");
      return;
    }
    setChecking(true);
    const client = createSupabaseClient(trimmedUrl, trimmedKey);
    if (!client) {
      setChecking(false);
      setError("Supabase istemcisi başlatılamadı. Bağlantınızı kontrol edin.");
      return;
    }
    try {
      await client.auth.getSession();
      saveSupabaseConfig(trimmedUrl, trimmedKey);
      setChecking(false);
      onSaved(trimmedUrl, trimmedKey);
    } catch (e) {
      setChecking(false);
      setError("Bağlantı kurulamadı. URL ve anahtarı kontrol edip tekrar deneyin.");
    }
  }

  return (
    <div className="flex-1 flex flex-col justify-center px-6 py-10">
      <div className="text-center mb-8">
        <div className="text-4xl mb-3">🌱</div>
        <h1 className="text-2xl font-semibold" style={{ fontFamily: FONT_DISPLAY, color: COLORS.ink }}>
          Bahçe Defterim
        </h1>
        <p className="text-sm mt-2" style={{ color: COLORS.inkSoft }}>
          Bu uygulama kendi Supabase projenize bağlanır. Kurulum bilgilerinizi bir kere girin, yeterli.
        </p>
      </div>

      <div className="space-y-4">
        <FormField label="Project URL" hint="Supabase panelinde Project Settings → API altında">
          <TextInput value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://xxxxx.supabase.co" error={!!error} />
        </FormField>
        <FormField label="anon / public API key">
          <TextInput value={anonKey} onChange={(e) => setAnonKey(e.target.value)} placeholder="eyJhbGciOiJIUzI1NiIs..." error={!!error} />
        </FormField>
        {error && <p className="text-xs" style={{ color: COLORS.clay }}>{error}</p>}
        <PrimaryButton onClick={handleSubmit} disabled={checking}>
          {checking ? <IconLoader size={16} /> : null} Kaydet ve Başla
        </PrimaryButton>
      </div>
    </div>
  );
}

/*  Auth screen — login / sign up                                      */

function AuthScreen({ supabaseClient, onShowToast }) {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [signupDone, setSignupDone] = useState(false);

  async function handleSubmit() {
    setError("");
    if (!email.trim() || !password) {
      setError("E-posta ve şifre gerekli.");
      return;
    }
    if (password.length < 6) {
      setError("Şifre en az 6 karakter olmalı.");
      return;
    }
    setBusy(true);
    try {
      if (mode === "login") {
        const { error: err } = await supabaseClient.auth.signInWithPassword({ email: email.trim(), password: password });
        if (err) throw err;
      } else {
        const { error: err } = await supabaseClient.auth.signUp({ email: email.trim(), password: password });
        if (err) throw err;
        setSignupDone(true);
      }
    } catch (e) {
      const msg = (e && e.message) || "";
      if (msg.indexOf("Invalid login") >= 0) setError("E-posta veya şifre hatalı.");
      else if (msg.indexOf("already registered") >= 0 || msg.indexOf("already exists") >= 0) setError("Bu e-posta zaten kayıtlı. Giriş yapmayı deneyin.");
      else if (msg.indexOf("Email not confirmed") >= 0) setError("E-posta henüz doğrulanmamış. Gelen kutunuzu kontrol edin.");
      else setError(msg || "Bir sorun oluştu, tekrar deneyin.");
    } finally {
      setBusy(false);
    }
  }

  if (signupDone) {
    return (
      <div className="flex-1 flex flex-col items-center justify-center text-center px-6 py-10">
        <div className="text-4xl mb-3">📩</div>
        <h2 className="text-xl font-semibold mb-2" style={{ fontFamily: FONT_DISPLAY, color: COLORS.ink }}>
          E-postanı kontrol et
        </h2>
        <p className="text-sm mb-6" style={{ color: COLORS.inkSoft }}>
          <strong>{email}</strong> adresine bir doğrulama linki gönderdik. Onayladıktan sonra giriş yapabilirsin.
        </p>
        <button onClick={() => { setSignupDone(false); setMode("login"); }} className="text-sm font-medium" style={{ color: COLORS.olive }}>
          Giriş ekranına dön
        </button>
      </div>
    );
  }

  return (
    <div className="flex-1 flex flex-col justify-center px-6 py-10">
      <div className="text-center mb-8">
        <div className="text-4xl mb-3">🌱</div>
        <h1 className="text-2xl font-semibold" style={{ fontFamily: FONT_DISPLAY, color: COLORS.ink }}>
          Bahçe Defterim
        </h1>
        <p className="text-sm mt-2" style={{ color: COLORS.inkSoft }}>
          {mode === "login" ? "Hesabınızla giriş yapın." : "Yeni bir hesap oluşturun."}
        </p>
      </div>

      <div className="space-y-4">
        <FormField label="E-posta">
          <TextInput type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="ornek@eposta.com" error={!!error} autoCapitalize="none" />
        </FormField>
        <FormField label="Şifre">
          <TextInput type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="En az 6 karakter" error={!!error} />
        </FormField>
        {error && <p className="text-xs" style={{ color: COLORS.clay }}>{error}</p>}
        <PrimaryButton onClick={handleSubmit} disabled={busy}>
          {busy ? <IconLoader size={16} /> : null} {mode === "login" ? "Giriş Yap" : "Kayıt Ol"}
        </PrimaryButton>
      </div>

      <button
        onClick={() => { setMode(mode === "login" ? "signup" : "login"); setError(""); }}
        className="text-sm font-medium mt-5 text-center"
        style={{ color: COLORS.inkSoft }}
      >
        {mode === "login" ? "Hesabın yok mu? " : "Zaten hesabın var mı? "}
        <span style={{ color: COLORS.olive, fontWeight: 600 }}>{mode === "login" ? "Kayıt ol" : "Giriş yap"}</span>
      </button>
    </div>
  );
}

function GardenFormView({ initialValues, isEdit, onSave, onSaveAndAddAnother, onCancel }) {
  const [form, setForm] = useState(
    () =>
      initialValues || {
        name: "",
        category: "sebze",
        crop: "",
        areaM2: "",
        areaUnit: "m2",
        plantingDate: "",
        notes: "",
      }
  );
  const [errors, setErrors] = useState({});
  const cropOptions = CROPS[form.category] || [];

  function update(field, value) {
    setForm((prev) => Object.assign({}, prev, { [field]: value }));
  }
  function handleCategoryChange(catKey) {
    setForm((prev) => Object.assign({}, prev, { category: catKey, crop: "" }));
  }
  function handleUnitToggle(newUnit) {
    setForm((prev) => {
      if (prev.areaUnit === newUnit) return prev;
      const num = parseFloat(String(prev.areaM2).replace(",", "."));
      if (isNaN(num)) return Object.assign({}, prev, { areaUnit: newUnit });
      const converted = newUnit === "donum" ? num / 1000 : num * 1000;
      const rounded = Math.round(converted * 1000) / 1000;
      return Object.assign({}, prev, { areaUnit: newUnit, areaM2: String(rounded) });
    });
  }
  function validate() {
    const errs = {};
    if (!form.name.trim()) errs.name = "Bahçe adı gerekli";
    if (!form.crop) errs.crop = "Ürün türü seçin";
    const areaNum = parseFloat(String(form.areaM2).replace(",", "."));
    if (!form.areaM2 || isNaN(areaNum) || areaNum <= 0) errs.areaM2 = "Geçerli bir alan girin";
    setErrors(errs);
    return Object.keys(errs).length === 0;
  }
  function buildPayload() {
    const areaNum = parseFloat(String(form.areaM2).replace(",", "."));
    const areaM2 = form.areaUnit === "donum" ? areaNum * 1000 : areaNum;
    return {
      name: form.name.trim(),
      category: form.category,
      crop: form.crop,
      areaM2: areaM2,
      plantingDate: form.plantingDate || null,
      notes: form.notes.trim(),
    };
  }
  function handleSubmit(andAnother) {
    if (!validate()) return;
    const payload = buildPayload();
    if (andAnother) {
      onSaveAndAddAnother(payload);
      setForm({ name: "", category: form.category, crop: "", areaM2: "", areaUnit: "m2", plantingDate: "", notes: "" });
      setErrors({});
    } else {
      onSave(payload);
    }
  }

  return (
    <div className="flex-1 flex flex-col">
      <header className="px-4 pt-6 pb-4 flex items-center gap-3" style={{ borderBottom: "1px solid " + COLORS.line }}>
        <button onClick={onCancel} className="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style={{ backgroundColor: COLORS.bgAlt }} aria-label="Vazgeç">
          <IconArrowLeft size={18} color={COLORS.ink} />
        </button>
        <h1 className="text-xl font-semibold" style={{ fontFamily: FONT_DISPLAY, color: COLORS.ink }}>
          {isEdit ? "Bahçeyi Düzenle" : "Yeni Bahçe"}
        </h1>
      </header>

      <div className="px-4 mt-4 space-y-4" style={{ paddingBottom: "2.5rem" }}>
        <FormField label="Bahçe adı" error={errors.name}>
          <TextInput value={form.name} onChange={(e) => update("name", e.target.value)} placeholder="Örn. Arka Bahçe, 1 No'lu Tarla" error={errors.name} />
        </FormField>

        <FormField label="Ana kategori">
          <div className="grid grid-cols-4 gap-2">
            {CATEGORIES.map((c) => {
              const active = form.category === c.key;
              return (
                <button key={c.key} onClick={() => handleCategoryChange(c.key)} className="flex flex-col items-center justify-center gap-1 rounded-xl py-2.5" style={{ backgroundColor: active ? c.color : COLORS.bgAlt, color: active ? COLORS.white : COLORS.inkSoft }}>
                  <span style={{ fontSize: 16 }}>{c.icon}</span>
                  <span className="text-xs font-medium">{c.label}</span>
                </button>
              );
            })}
          </div>
        </FormField>

        <FormField label="Ürün türü" error={errors.crop}>
          <select value={form.crop} onChange={(e) => update("crop", e.target.value)} className="w-full text-sm rounded-xl py-2.5 px-3 outline-none" style={{ backgroundColor: COLORS.bgAlt, color: COLORS.ink, border: errors.crop ? "1px solid " + COLORS.clay : "1px solid transparent" }}>
            <option value="">Seçin...</option>
            {cropOptions.map((c) => (
              <option key={c.key} value={c.key}>{c.icon} {c.label}</option>
            ))}
          </select>
        </FormField>

        <FormField label="Alan" error={errors.areaM2} hint="1 dönüm = 1.000 m²">
          <div className="flex gap-2">
            <input value={form.areaM2} onChange={(e) => update("areaM2", e.target.value)} inputMode="decimal" placeholder={form.areaUnit === "donum" ? "Örn. 3,5" : "Örn. 3500"} className="flex-1 min-w-0 text-sm rounded-xl py-2.5 px-3 outline-none" style={{ backgroundColor: COLORS.bgAlt, color: COLORS.ink, border: errors.areaM2 ? "1px solid " + COLORS.clay : "1px solid transparent" }} />
            <div className="flex rounded-xl overflow-hidden flex-shrink-0" style={{ border: "1px solid " + COLORS.line }}>
              <button onClick={() => handleUnitToggle("m2")} className="px-3 text-sm font-medium" style={{ backgroundColor: form.areaUnit === "m2" ? COLORS.olive : "transparent", color: form.areaUnit === "m2" ? COLORS.white : COLORS.inkSoft }}>m²</button>
              <button onClick={() => handleUnitToggle("donum")} className="px-3 text-sm font-medium" style={{ backgroundColor: form.areaUnit === "donum" ? COLORS.olive : "transparent", color: form.areaUnit === "donum" ? COLORS.white : COLORS.inkSoft }}>dönüm</button>
            </div>
          </div>
        </FormField>

        <FormField label="Dikim tarihi (opsiyonel)">
          <input type="date" value={form.plantingDate || ""} onChange={(e) => update("plantingDate", e.target.value)} className="w-full text-sm rounded-xl py-2.5 px-3 outline-none" style={{ backgroundColor: COLORS.bgAlt, color: COLORS.ink }} />
        </FormField>

        <FormField label="Notlar (opsiyonel)">
          <textarea value={form.notes} onChange={(e) => update("notes", e.target.value)} rows={3} placeholder="Toprak yapısı, çeşit, konum vb." className="w-full text-sm rounded-xl py-2.5 px-3 outline-none resize-none" style={{ backgroundColor: COLORS.bgAlt, color: COLORS.ink }} />
        </FormField>

        <div className="pt-2 space-y-3">
          <PrimaryButton onClick={() => handleSubmit(false)}>Kaydet</PrimaryButton>
          {!isEdit && (
            <button onClick={() => handleSubmit(true)} className="w-full py-3 rounded-xl font-medium text-sm" style={{ backgroundColor: COLORS.bgAlt, color: COLORS.ink }}>
              Kaydet ve Yeni Ekle
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function CalendarView({ entries, monthDate, onPrevMonth, onNextMonth, onToday, onOpenGarden }) {
  const [selectedDate, setSelectedDate] = useState(null);
  const year = monthDate.getUTCFullYear();
  const month = monthDate.getUTCMonth();
  const monthLabel = monthDate.toLocaleDateString("tr-TR", { month: "long", year: "numeric", timeZone: "UTC" });
  const numDays = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
  const firstWeekday = (new Date(Date.UTC(year, month, 1)).getUTCDay() + 6) % 7;
  const todayIso = isoToday();

  const entriesByDate = useMemo(() => {
    const map = {};
    entries.forEach((e) => { if (!map[e.date]) map[e.date] = []; map[e.date].push(e); });
    return map;
  }, [entries]);

  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= numDays; d++) cells.push(isoOfYMD(year, month, d));
  while (cells.length % 7 !== 0) cells.push(null);

  const selectedEntries = selectedDate ? entriesByDate[selectedDate] || [] : [];

  return (
    <div className="flex-1 flex flex-col">
      <header className="px-4 pt-6 pb-4" style={{ borderBottom: "1px solid " + COLORS.line }}>
        <h1 className="text-2xl font-semibold" style={{ fontFamily: FONT_DISPLAY, color: COLORS.ink }}>Takvim</h1>
        <div className="flex items-center justify-between mt-3">
          <button onClick={onPrevMonth} className="w-8 h-8 rounded-full flex items-center justify-center" style={{ backgroundColor: COLORS.bgAlt }} aria-label="Önceki ay"><IconChevronLeft size={16} color={COLORS.ink} /></button>
          <button onClick={onToday} className="text-sm font-medium capitalize" style={{ color: COLORS.ink, fontFamily: FONT_DISPLAY }}>{monthLabel}</button>
          <button onClick={onNextMonth} className="w-8 h-8 rounded-full flex items-center justify-center" style={{ backgroundColor: COLORS.bgAlt }} aria-label="Sonraki ay"><IconChevronRight size={16} color={COLORS.ink} /></button>
        </div>
      </header>

      <div className="px-4 mt-4">
        <div className="grid grid-cols-7 gap-1 mb-1.5">
          {WEEKDAY_LABELS.map((w) => <div key={w} className="text-center text-xs font-medium" style={{ color: COLORS.inkSoft }}>{w}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map((iso, idx) => {
            if (!iso) return <div key={idx} />;
            const dayEntries = entriesByDate[iso] || [];
            const uniqueColors = [];
            const seen = {};
            dayEntries.forEach((e) => {
              if (!seen[e.type]) { seen[e.type] = true; const meta = LOG_TYPES.find((lt) => lt.key === e.type); if (meta) uniqueColors.push(meta.color); }
            });
            const dayNum = parseInt(iso.split("-")[2], 10);
            const isToday = iso === todayIso;
            const isSelected = iso === selectedDate;
            return (
              <button key={iso} onClick={() => setSelectedDate(isSelected ? null : iso)} className="aspect-square rounded-lg flex flex-col items-center justify-center gap-0.5" style={{ backgroundColor: isSelected ? COLORS.olive : isToday ? COLORS.goldSoft : COLORS.white, border: "1px solid " + (isSelected ? COLORS.olive : COLORS.line) }}>
                <span className="text-xs" style={{ color: isSelected ? COLORS.white : COLORS.ink, fontFamily: FONT_MONO }}>{dayNum}</span>
                <div className="flex gap-0.5" style={{ minHeight: 4 }}>
                  {uniqueColors.slice(0, 4).map((c, i) => <span key={i} style={{ width: 4, height: 4, borderRadius: 999, backgroundColor: isSelected ? COLORS.white : c, display: "block" }} />)}
                </div>
              </button>
            );
          })}
        </div>
      </div>

      <div className="px-4 mt-5 flex-1" style={{ paddingBottom: "2rem" }}>
        {selectedDate && (
          <>
            <p className="text-xs font-semibold mb-2" style={{ color: COLORS.inkSoft }}><Num>{formatDateTR(selectedDate)}</Num> KAYITLARI</p>
            {selectedEntries.length === 0 && <p className="text-sm py-4" style={{ color: COLORS.inkSoft }}>Bu tarihte kayıt yok.</p>}
            <div className="space-y-2">
              {selectedEntries.map((e) => <CalendarEntryRow key={e.id} entry={e} onOpenGarden={onOpenGarden} />)}
            </div>
          </>
        )}
        {!selectedDate && <p className="text-sm text-center py-6" style={{ color: COLORS.inkSoft }}>Kayıtları görmek için bir güne dokunun.</p>}
      </div>
    </div>
  );
}

        </div>
      </header>
      <div className="px-4 mt-4 space-y-2 flex-1" style={{ paddingBottom: "2rem" }}>
        {users.map((u) => (
          <button key={u.id} onClick={() => onSelectUser(u)} className="w-full flex items-center gap-3 rounded-xl p-3 text-left" style={{ backgroundColor: COLORS.white, border: "1px solid " + COLORS.line }}>
            <div className="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style={{ backgroundColor: COLORS.bgAlt }}>
              <IconUser size={16} color={COLORS.inkSoft} />
            </div>
            <div className="flex-1 min-w-0">
              <p className="text-sm font-medium truncate" style={{ color: COLORS.ink }}>{u.email}{u.role === "admin" ? " ★" : ""}</p>
              <p className="text-xs mt-0.5" style={{ color: COLORS.inkSoft }}><Num>{u.gardenCount} bahçe</Num></p>
            </div>
            <IconChevronRight size={16} color={COLORS.inkSoft} />
          </button>
        ))}
        {users.length === 0 && <p className="text-sm text-center py-10" style={{ color: COLORS.inkSoft }}>Henüz başka kullanıcı yok.</p>}
      </div>
    </div>
  );
}

function AdminUserGardensView({ targetUser, gardens, loading, onBack, onSelectGarden }) {
  return (
    <div className="flex-1 flex flex-col">
      <header className="px-4 pt-6 pb-4 flex items-center gap-3" style={{ borderBottom: "1px solid " + COLORS.line }}>
        <button onClick={onBack} className="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style={{ backgroundColor: COLORS.bgAlt }} aria-label="Geri"><IconArrowLeft size={18} color={COLORS.ink} /></button>
        <div className="min-w-0">
          <h1 className="text-xl font-semibold truncate" style={{ fontFamily: FONT_DISPLAY, color: COLORS.ink }}>{targetUser.email}</h1>
          <p className="text-xs mt-0.5" style={{ color: COLORS.inkSoft }}>Salt okunur görünüm</p>
        </div>
      </header>
      <div className="px-4 mt-4 flex-1" style={{ paddingBottom: "2rem" }}>
        {loading && (
          <div className="flex items-center justify-center py-12"><IconLoader size={20} color={COLORS.olive} /></div>
        )}
        {!loading && gardens.length === 0 && <p className="text-sm text-center py-10" style={{ color: COLORS.inkSoft }}>Bu kullanıcının henüz bahçesi yok.</p>}
        {!loading && gardens.map((g) => (
          <GardenCard key={g.id} garden={g} crop={CROP_BY_KEY[g.crop]} category={CATEGORIES.find((c) => c.key === g.category)} onClick={() => onSelectGarden(g)} />
        ))}
      </div>
    </div>
  );
}

function TabBar({ active, onChange }) {
  const tabs = [
    { key: "list", label: "Bahçeler", icon: "🌻" },
    { key: "calendar", label: "Takvim", icon: "📅" },
    { key: "stats", label: "İstatistik", icon: "📊" },
    { key: "profile", label: "Profil", icon: "👤" },
  ];
  return (
    <div className="sticky bottom-0 left-0 right-0 z-30" style={{ backgroundColor: COLORS.white, borderTop: "1px solid " + COLORS.line }}>
      <div className="flex">
        {tabs.map((t) => {
          const isActive = active === t.key;
          return (
            <button key={t.key} onClick={() => onChange(t.key)} className="flex-1 flex flex-col items-center justify-center gap-1 py-2.5">
              <span style={{ fontSize: 18, opacity: isActive ? 1 : 0.55 }}>{t.icon}</span>
              <span className="text-xs font-medium" style={{ color: isActive ? COLORS.olive : COLORS.inkSoft }}>{t.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}
/* ------------------------------------------------------------------ */
/*  Root component                                                     */
/* ------------------------------------------------------------------ */

async function loadMainData(client, userId) {
  const [gardensRes, logsRes] = await Promise.all([
    client.from("gardens").select("*").eq("user_id", userId).order("created_at", { ascending: false }),
    client.from("garden_logs").select("*").eq("user_id", userId).order("date", { ascending: false }),
  ]);
  return {
    gardens: gardensRes.data || [],
    logs: logsRes.data || [],
    error: gardensRes.error || logsRes.error || null,
  };
}

function App() {
  const [configLoaded, setConfigLoaded] = useState(false);
  const [config, setConfig] = useState(null);
  const [supabaseClient, setSupabaseClient] = useState(null);

  const [authChecked, setAuthChecked] = useState(false);
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);

  const [gardens, setGardens] = useState([]);
  const [logs, setLogs] = useState([]);
  const [dataLoading, setDataLoading] = useState(false);

  const [view, setView] = useState("main");
  const [mainTab, setMainTab] = useState("list");
  const [selectedGardenId, setSelectedGardenId] = useState(null);
  const [searchQuery, setSearchQuery] = useState("");
  const [categoryFilter, setCategoryFilter] = useState("tumu");
  const [logTypeFilter, setLogTypeFilter] = useState("tumu");
  const [editingGardenId, setEditingGardenId] = useState(null);
  const [showLogForm, setShowLogForm] = useState(false);
  const [confirmState, setConfirmState] = useState(null);
  const [toast, setToast] = useState(null);
  const [calendarMonth, setCalendarMonth] = useState(() => {
    const now = new Date();
    return new Date(Date.UTC(now.getFullYear(), now.getMonth(), 1));
  });

  const [adminUsers, setAdminUsers] = useState([]);
  const [adminUsersLoading, setAdminUsersLoading] = useState(false);
  const [adminTargetUser, setAdminTargetUser] = useState(null);
  const [adminTargetGardens, setAdminTargetGardens] = useState([]);
  const [adminTargetGardensLoading, setAdminTargetGardensLoading] = useState(false);
  const [adminTargetGarden, setAdminTargetGarden] = useState(null);
  const [adminTargetGardenLogs, setAdminTargetGardenLogs] = useState([]);

  useEffect(() => {
    const cfg = loadSupabaseConfig();
    setConfig(cfg);
    setConfigLoaded(true);
  }, []);

  useEffect(() => {
    if (!config) return;
    setSupabaseClient(createSupabaseClient(config.url, config.anonKey));
  }, [config]);

  useEffect(() => {
    if (!supabaseClient) return;
    let mounted = true;
    supabaseClient.auth.getSession().then(({ data }) => {
      if (mounted) { setSession(data.session); setAuthChecked(true); }
    }).catch(() => { if (mounted) setAuthChecked(true); });
    const { data: listener } = supabaseClient.auth.onAuthStateChange((event, newSession) => {
      if (mounted) setSession(newSession);
    });
    return () => { mounted = false; if (listener && listener.subscription) listener.subscription.unsubscribe(); };
  }, [supabaseClient]);

  useEffect(() => {
    if (!supabaseClient || !session) { setProfile(null); return; }
    let mounted = true;
    (async () => {
      const { data } = await supabaseClient.from("profiles").select("*").eq("id", session.user.id).single();
      if (mounted) setProfile(data || null);
    })();
    return () => { mounted = false; };
  }, [supabaseClient, session]);

  useEffect(() => {
    if (!supabaseClient || !session || !profile) return;
    let mounted = true;
    setDataLoading(true);
    (async () => {
      const result = await loadMainData(supabaseClient, session.user.id);
      if (mounted) { setGardens(result.gardens); setLogs(result.logs); setDataLoading(false); }
    })();
    return () => { mounted = false; };
  }, [supabaseClient, session, profile]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2400);
    return () => clearTimeout(t);
  }, [toast]);

  function showToast(message, tone) {
    setToast({ message: message, tone: tone || "success" });
  }

  const calendarEntries = useMemo(() => {
    const nameById = {};
    gardens.forEach((g) => { nameById[g.id] = g.name; });
    return logs.map((l) => Object.assign({}, l, { gardenName: nameById[l.garden_id] || "" }));
  }, [logs, gardens]);

  const selectedGardenLogs = useMemo(() => {
    return logs.filter((l) => l.garden_id === selectedGardenId).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  }, [logs, selectedGardenId]);

  function openGardenDetail(id) {
    setSelectedGardenId(id);
    setLogTypeFilter("tumu");
    setView("detail");
  }
  function openAddForm() { setEditingGardenId(null); setView("gardenForm"); }
  function openEditForm() { setEditingGardenId(selectedGardenId); setView("gardenForm"); }

  async function handleSaveNewGarden(payload, stayOnForm) {
    const row = { user_id: session.user.id, name: payload.name, category: payload.category, crop: payload.crop, area_m2: payload.areaM2, planting_date: payload.plantingDate, notes: payload.notes };
    const { data, error } = await supabaseClient.from("gardens").insert(row).select().single();
    if (error) { showToast("Kaydedilemedi: " + error.message, "error"); return; }
    setGardens((prev) => [data].concat(prev));
    showToast("Bahçe eklendi");
    if (!stayOnForm) setView("main");
  }
  async function handleSaveEditGarden(payload) {
    const row = { name: payload.name, category: payload.category, crop: payload.crop, area_m2: payload.areaM2, planting_date: payload.plantingDate, notes: payload.notes };
    const { data, error } = await supabaseClient.from("gardens").update(row).eq("id", editingGardenId).select().single();
    if (error) { showToast("Güncellenemedi: " + error.message, "error"); return; }
    setGardens((prev) => prev.map((g) => (g.id === data.id ? data : g)));
    showToast("Bahçe güncellendi");
    setView("detail");
  }
  async function handleAddLog(logValues) {
    const row = { garden_id: selectedGardenId, user_id: session.user.id, type: logValues.type, date: logValues.date, detail: logValues.detail || null, amount: logValues.amount || null, note: logValues.note || null };
    const { data, error } = await supabaseClient.from("garden_logs").insert(row).select().single();
    if (error) { showToast("Kaydedilemedi: " + error.message, "error"); return; }
    setLogs((prev) => [data].concat(prev));
    const { data: updatedGarden } = await supabaseClient.from("gardens").select("*").eq("id", selectedGardenId).single();
    if (updatedGarden) setGardens((prev) => prev.map((g) => (g.id === updatedGarden.id ? updatedGarden : g)));
    showToast("Kayıt eklendi");
    setShowLogForm(false);
  }
  async function handleDeleteLogEntry(gardenId, logId) {
    const { error } = await supabaseClient.from("garden_logs").delete().eq("id", logId);
    if (error) { showToast("Silinemedi", "error"); setConfirmState(null); return; }
    setLogs((prev) => prev.filter((l) => l.id !== logId));
    const { data: updatedGarden } = await supabaseClient.from("gardens").select("*").eq("id", gardenId).single();
    if (updatedGarden) setGardens((prev) => prev.map((g) => (g.id === updatedGarden.id ? updatedGarden : g)));
    showToast("Kayıt silindi");
    setConfirmState(null);
  }
  async function handleDeleteGardenConfirmed(gardenId) {
    const { error } = await supabaseClient.from("gardens").delete().eq("id", gardenId);
    if (error) { showToast("Silinemedi", "error"); setConfirmState(null); return; }
    setGardens((prev) => prev.filter((g) => g.id !== gardenId));
    setLogs((prev) => prev.filter((l) => l.garden_id !== gardenId));
    showToast("Bahçe silindi");
    setConfirmState(null);
    setView("main");
    setSelectedGardenId(null);
  }
  async function handleResetAllConfirmed() {
    const { error } = await supabaseClient.from("gardens").delete().eq("user_id", session.user.id);
    if (error) { showToast("Silinemedi", "error"); setConfirmState(null); return; }
    setGardens([]);
    setLogs([]);
    showToast("Tüm bahçeler silindi");
    setConfirmState(null);
    setView("main");
    setMainTab("list");
  }
  async function handleSignOut() {
    await supabaseClient.auth.signOut();
    setGardens([]); setLogs([]); setView("main"); setMainTab("list");
  }

  function goToPrevMonth() { setCalendarMonth((p) => new Date(Date.UTC(p.getUTCFullYear(), p.getUTCMonth() - 1, 1))); }
  function goToNextMonth() { setCalendarMonth((p) => new Date(Date.UTC(p.getUTCFullYear(), p.getUTCMonth() + 1, 1))); }
  function goToCurrentMonth() { const n = new Date(); setCalendarMonth(new Date(Date.UTC(n.getFullYear(), n.getMonth(), 1))); }

  async function openAdminPanel() {
    setView("adminUsers");
    setAdminUsersLoading(true);
    const { data: profiles } = await supabaseClient.from("profiles").select("*").order("created_at");
    const { data: allGardens } = await supabaseClient.from("gardens").select("id, user_id");
    const counts = {};
    (allGardens || []).forEach((g) => { counts[g.user_id] = (counts[g.user_id] || 0) + 1; });
    setAdminUsers((profiles || []).map((p) => Object.assign({}, p, { gardenCount: counts[p.id] || 0 })));
    setAdminUsersLoading(false);
  }
  async function openAdminUserGardens(user) {
    setAdminTargetUser(user);
    setView("adminUserGardens");
    setAdminTargetGardensLoading(true);
    const { data } = await supabaseClient.from("gardens").select("*").eq("user_id", user.id).order("created_at", { ascending: false });
    setAdminTargetGardens(data || []);
    setAdminTargetGardensLoading(false);
  }
  async function openAdminGardenDetail(garden) {
    setAdminTargetGarden(garden);
    const { data } = await supabaseClient.from("garden_logs").select("*").eq("garden_id", garden.id).order("date", { ascending: false });
    setAdminTargetGardenLogs(data || []);
    setView("adminGardenDetail");
  }

  const selectedGarden = gardens.find((g) => g.id === selectedGardenId) || null;
  const editingGarden = editingGardenId ? gardens.find((g) => g.id === editingGardenId) : null;
  const gardenFormInitialValues = editingGarden ? {
    name: editingGarden.name, category: editingGarden.category, crop: editingGarden.crop,
    areaM2: editingGarden.area_m2 >= 1000 ? Math.round((editingGarden.area_m2 / 1000) * 1000) / 1000 : editingGarden.area_m2,
    areaUnit: editingGarden.area_m2 >= 1000 ? "donum" : "m2",
    plantingDate: editingGarden.planting_date || "", notes: editingGarden.notes || "",
  } : null;
  const totalAreaM2 = useMemo(() => gardens.reduce((sum, g) => sum + (g.area_m2 || 0), 0), [gardens]);

  const showSetup = configLoaded && !config;
  const showAuth = configLoaded && config && supabaseClient && authChecked && !session;
  const showApp = configLoaded && config && supabaseClient && authChecked && session && profile;
  const showLoadingGate = configLoaded && config && supabaseClient && (!authChecked || (session && !profile));

  return (
    <div className="min-h-screen flex justify-center" style={{ backgroundColor: COLORS.desk }}>
      <div className="w-full flex flex-col" style={{ maxWidth: "28rem", backgroundColor: COLORS.bg, minHeight: "100vh", fontFamily: FONT_BODY }}>
        <Toast toast={toast} />

        {!configLoaded && (
          <div className="flex-1 flex items-center justify-center py-24"><IconLoader size={22} color={COLORS.olive} /></div>
        )}

        {showSetup && <SetupScreen onSaved={(url, key) => setConfig({ url: url, anonKey: key })} />}

        {showLoadingGate && (
          <div className="flex-1 flex items-center justify-center py-24"><IconLoader size={22} color={COLORS.olive} /></div>
        )}

        {showAuth && <AuthScreen supabaseClient={supabaseClient} />}

        {showApp && dataLoading && (
          <div className="flex-1 flex items-center justify-center py-24"><IconLoader size={22} color={COLORS.olive} /></div>
        )}

        {showApp && !dataLoading && view === "main" && mainTab === "list" && (
          <ListView gardens={gardens} searchQuery={searchQuery} setSearchQuery={setSearchQuery} categoryFilter={categoryFilter} setCategoryFilter={setCategoryFilter} onSelectGarden={openGardenDetail} onAddGarden={openAddForm} totalAreaM2={totalAreaM2} />
        )}
        {showApp && !dataLoading && view === "main" && mainTab === "calendar" && (
          <CalendarView entries={calendarEntries} monthDate={calendarMonth} onPrevMonth={goToPrevMonth} onNextMonth={goToNextMonth} onToday={goToCurrentMonth} onOpenGarden={openGardenDetail} />
        )}
        {showApp && !dataLoading && view === "main" && mainTab === "stats" && (
          <StatsView gardens={gardens} onSelectGarden={openGardenDetail} onResetAll={() => setConfirmState({ type: "resetAll" })} />
        )}
        {showApp && !dataLoading && view === "main" && mainTab === "profile" && (
          <ProfileView profile={profile} onSignOut={handleSignOut} onGoAdmin={openAdminPanel} />
        )}
        {showApp && !dataLoading && view === "main" && <TabBar active={mainTab} onChange={setMainTab} />}

        {showApp && view === "detail" && selectedGarden && (
          <GardenDetailView garden={selectedGarden} crop={CROP_BY_KEY[selectedGarden.crop]} category={CATEGORIES.find((c) => c.key === selectedGarden.category)} logs={selectedGardenLogs} logTypeFilter={logTypeFilter} setLogTypeFilter={setLogTypeFilter}
            onBack={() => setView("main")} onEdit={openEditForm}
            onDeleteGarden={() => setConfirmState({ type: "garden", gardenId: selectedGarden.id })}
            onAddLog={() => setShowLogForm(true)}
            onDeleteLog={(logId) => setConfirmState({ type: "log", gardenId: selectedGarden.id, logId: logId })} />
        )}

        {showApp && view === "gardenForm" && (
          <GardenFormView key={editingGardenId || "new"} isEdit={!!editingGardenId} initialValues={gardenFormInitialValues}
            onSave={(payload) => (editingGardenId ? handleSaveEditGarden(payload) : handleSaveNewGarden(payload, false))}
            onSaveAndAddAnother={(payload) => handleSaveNewGarden(payload, true)}
            onCancel={() => setView(editingGardenId ? "detail" : "main")} />
        )}

        {showApp && view === "adminUsers" && (
          <AdminUsersView users={adminUsers} onBack={() => { setView("main"); setMainTab("profile"); }} onSelectUser={openAdminUserGardens} />
        )}
        {showApp && view === "adminUserGardens" && adminTargetUser && (
          <AdminUserGardensView targetUser={adminTargetUser} gardens={adminTargetGardens} loading={adminTargetGardensLoading} onBack={() => setView("adminUsers")} onSelectGarden={openAdminGardenDetail} />
        )}
        {showApp && view === "adminGardenDetail" && adminTargetGarden && (
          <GardenDetailView garden={adminTargetGarden} crop={CROP_BY_KEY[adminTargetGarden.crop]} category={CATEGORIES.find((c) => c.key === adminTargetGarden.category)} logs={adminTargetGardenLogs} logTypeFilter={logTypeFilter} setLogTypeFilter={setLogTypeFilter}
            onBack={() => setView("adminUserGardens")} readOnly ownerLabel={adminTargetUser ? adminTargetUser.email : ""} />
        )}

        {showApp && showLogForm && <LogFormSheet onCancel={() => setShowLogForm(false)} onSave={handleAddLog} />}

        {showApp && confirmState && confirmState.type === "garden" && (
          <ConfirmDialog title="Bahçeyi sil" message="Bu bahçeyi ve tüm kayıtlarını silmek istediğinize emin misiniz? Bu işlem geri alınamaz." confirmLabel="Sil" danger onConfirm={() => handleDeleteGardenConfirmed(confirmState.gardenId)} onCancel={() => setConfirmState(null)} />
        )}
        {showApp && confirmState && confirmState.type === "log" && (
          <ConfirmDialog title="Kaydı sil" message="Bu kaydı silmek istediğinize emin misiniz?" confirmLabel="Sil" danger onConfirm={() => handleDeleteLogEntry(confirmState.gardenId, confirmState.logId)} onCancel={() => setConfirmState(null)} />
        )}
        {showApp && confirmState && confirmState.type === "resetAll" && (
          <ConfirmDialog title="Tüm bahçeleri sil" message="Tüm bahçeleriniz ve kayıtları kalıcı olarak silinecek. Bu işlem geri alınamaz." confirmLabel="Sıfırla" danger onConfirm={handleResetAllConfirmed} onCancel={() => setConfirmState(null)} />
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
